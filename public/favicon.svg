<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bar1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3E8C93"/>
      <stop offset="100%" stop-color="#8FDCE0"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#5B9A6E"/>
      <stop offset="100%" stop-color="#A9D9A0"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#A8A24E"/>
      <stop offset="100%" stop-color="#E0D97E"/>
    </linearGradient>
    <linearGradient id="bar4" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C88A2E"/>
      <stop offset="100%" stop-color="#FFCE54"/>
    </linearGradient>

    <radialGradient id="ambient" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#FFCE54" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFCE54" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="0.2" result="b1"/>
      <feGaussianBlur stdDeviation="0.45" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="#0B1017"/>
  <rect width="64" height="64" rx="16" fill="url(#ambient)"/>

  <rect x="12" y="44" width="8" height="12" rx="2.5" fill="url(#bar1)"/>
  <rect x="24" y="36" width="8" height="20" rx="2.5" fill="url(#bar2)"/>
  <rect x="36" y="28" width="8" height="28" rx="2.5" fill="url(#bar3)"/>
  <rect x="48" y="20" width="8" height="36" rx="2.5" fill="url(#bar4)"/>

  <polyline points="16,36 28,28 40,20 52,12" fill="none" stroke="#FFCE54" stroke-width="2.2"
            stroke-linecap="round"/>
  <circle cx="16" cy="36" r="2.4" fill="#FFCE54"/>
  <circle cx="28" cy="28" r="2.4" fill="#FFCE54"/>
  <circle cx="40" cy="20" r="2.4" fill="#FFCE54"/>
  <circle cx="52" cy="12" r="4.4" fill="#FFF3C4" filter="url(#glow)"/>
</svg>